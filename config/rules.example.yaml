# Gate policy for a candidate who cannot start without sponsorship.
# Match tokens are case-insensitive substrings.

cutoff_days: 21

location_tokens:
  - germany
  - berlin
  - munich
  - hamburg
  - netherlands
  - amsterdam
  - ireland
  - dublin
  - belgium
  - brussels
  - sweden
  - stockholm
  - austria
  - vienna
  - denmark
  - copenhagen
  - finland
  - helsinki
  - portugal
  - lisbon
  - remote

title_allow:
  - backend
  - back-end
  - back end
  - full stack
  - full-stack
  - fullstack
  - software engineer
  - software developer
  - product engineer
  - platform engineer

seniority_block:
  - senior
  - staff
  - principal
  - lead
  - head
  - director
  - manager
  - architect
  - intern
  - working student

# A phrase only counts as an offer when it is not inside a block phrase.
# "no visa sponsorship" must not be read as an offer.
sponsorship_phrases:
  - visa sponsorship
  - visa support
  - relocation support
  - relocation package
  - relocation assistance
  - we sponsor

block_phrases:
  - no visa sponsorship
  - not able to offer visa sponsorship
  - unable to offer visa sponsorship
  - not able to sponsor
  - unable to sponsor
  - cannot sponsor
  - do not sponsor
  - don't sponsor
  - no relocation
  - must already have the right to work
  - existing right to work
  - must already be based
  - must be based in
